name: Validate and request Android builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mobile project
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test -- --pool=forks --poolOptions.forks.singleFork=true

  check-expo-token:
    name: Check Expo build credential
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    outputs:
      available: ${{ steps.token.outputs.available }}
    steps:
      - id: token
        name: Check EXPO_TOKEN
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN is not configured. Validation completed, but no APK or AAB request was sent. Add the EXPO_TOKEN repository secret and push again."
          fi

  request-android-builds:
    name: Request ${{ matrix.label }} from Expo
    needs:
      - validate
      - check-expo-token
    if: ${{ needs.check-expo-token.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: preview
            label: Android APK
          - profile: production
            label: Android AAB
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize or link EAS project
        run: eas init --account toufikben2s-team --non-interactive

      - name: Request ${{ matrix.label }} build
        run: eas build --platform android --profile ${{ matrix.profile }} --non-interactive --no-wait
